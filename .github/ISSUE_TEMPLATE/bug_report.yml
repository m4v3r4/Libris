name: Bug report
description: Report a reproducible problem in Libris
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Libris. Please avoid posting private library/member data in a public issue.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the problem occur?
      options:
        - Windows
        - Linux
        - macOS
        - Android
        - iOS
        - Other
    validations:
      required: true

  - type: input
    id: libris-version
    attributes:
      label: Libris version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      description: Required mainly when running from source. Use `flutter --version`.
      placeholder: "e.g. 3.41.9"

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or attach screenshots. Remove personal or sensitive data first.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed personal, library-member, credential, and other sensitive information from this report.
          required: true
