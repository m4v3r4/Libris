name: libris
description: "Offline-first Flutter library management system for books, members, and loans."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  sqflite: 2.4.2
  sqflite_common_ffi: 2.4.0+1
  path_provider: ^2.1.6
  path: ^1.9.1
  csv: ^6.0.0
  file_picker: ^10.3.8
  excel: ^4.0.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
